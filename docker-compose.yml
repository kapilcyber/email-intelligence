# Ollama URLs: backend/.env.docker defaults (OLLAMA_CLASSIFY_* / OLLAMA_SUMMARY_*); override in backend/.env. extra_hosts helps host.docker.internal on Linux if you use that host instead.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: email_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    environment:
      OLLAMA_CLASSIFY_BASE_URL: http://172.16.200.30:11434/v1/
      OLLAMA_SUMMARY_BASE_URL: http://172.16.200.26:11434/v1/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    depends_on:
      - postgres
    entrypoint: [ "alembic" ]
    command: [ "upgrade", "head" ]
    restart: "no"

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - postgres
      - redis
    # Ingest worker: Graph fetch/backfill/sync + legacy celery queue (beat tasks)
    command: [ "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "ingest,celery", "--concurrency=6" ]

  worker_ai_classify:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_CLASSIFY_BASE_URL: http://172.16.200.30:11434/v1/
      # Faster CPU-only classification model
      OLLAMA_MODEL: "llama3.2:latest"
    depends_on:
      - backend
      - postgres
      - redis
    # AI worker (bulk): classification only
    command: [ "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "ai_classify", "--concurrency=2" ]

  worker_ai_summary:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_SUMMARY_BASE_URL: http://172.16.200.26:11434/v1/
      # Higher quality summaries (on-demand)
      OLLAMA_MODEL: "llama3.1:latest"
    depends_on:
      - backend
      - postgres
      - redis
    # AI worker (interactive): on-demand summary generation only
    command: [ "celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "ai_summary", "--concurrency=1" ]

  beat:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker
      - ./backend/.env
    depends_on:
      - backend
      - postgres
      - redis
    volumes:
      - celerybeat:/var/lib/celery
    command: [ "celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/var/lib/celery/celerybeat-schedule" ]

  dashboard:
    build:
      context: ./email-dashboard
      args:
        NEXT_PUBLIC_API_URL: /backend
        BACKEND_API_URL: http://backend:8000
        NEXTAUTH_URL: https://172.16.200.30
    env_file:
      - ./email-dashboard/.env.local
    depends_on:
      - backend
    expose:
      - "3001"

  dashboard_https:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/dashboard-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./email-dashboard/certificates/vm-ip-172.16.200.30.pem:/etc/nginx/certs/dashboard.pem:ro
      - ./email-dashboard/certificates/vm-ip-172.16.200.30-key.pem:/etc/nginx/certs/dashboard-key.pem:ro

  outlook_addin:
    image: nginx:1.27-alpine
    profiles:
      - outlook-addin
    ports:
      - "3010:80"
    volumes:
      - ./outlook-addin/dist:/usr/share/nginx/html:ro
      - ./outlook-addin/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    profiles:
      - ngrok
    depends_on:
      - dashboard_https
    env_file:
      - ./infra/ngrok/.env
    command:
      - "http"
      - "https://dashboard_https:443"
      - "--upstream-tls-verify=false"
    ports:
      - "4040:4040"

volumes:
  pgdata:
  celerybeat:

